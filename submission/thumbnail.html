<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Ledger Revival thumbnail</title>
<style>
  html, body { margin: 0; width: 1200px; height: 800px; overflow: hidden; }
  body {
    background:
      radial-gradient(700px 400px at 10% 0%, rgba(167,139,250,.28), transparent 60%),
      radial-gradient(700px 400px at 100% 100%, rgba(124,255,178,.18), transparent 60%),
      #0b0d10;
    color: #e6e9ee;
    font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
    padding: 64px 72px;
    box-sizing: border-box;
  }
  .kicker { color: #a78bfa; font-size: 24px; letter-spacing: .12em; text-transform: uppercase; }
  h1 { margin: 10px 0 0; font-size: 92px; line-height: 1.05; color: #7cffb2; text-shadow: 0 0 30px rgba(124,255,178,.45); }
  h1 span { display: block; font-size: 52px; color: #e6e9ee; text-shadow: none; margin-top: 6px; }
  .raw {
    margin-top: 44px; padding: 16px 20px; border: 1px dashed #4b5563; border-radius: 10px;
    font-family: Consolas, "Microsoft YaHei Mono", monospace; font-size: 22px; color: #8a94a3;
    text-decoration: line-through; text-decoration-color: rgba(248,113,113,.6);
  }
  .arrow { font-size: 34px; color: #a78bfa; margin: 10px 0 10px 20px; }
  table { border-collapse: collapse; font-size: 24px; width: 100%; background: #151a21; border-radius: 10px; overflow: hidden; }
  th { text-align: left; color: #8a94a3; font-weight: 600; padding: 10px 16px; background: #1a2029; font-size: 20px; }
  td { padding: 12px 16px; border-top: 1px solid #262d38; white-space: nowrap; }
  .chip { color: #4ade80; border: 2px solid #4ade80; border-radius: 999px; padding: 0 12px; font-size: 20px; }
  .badge {
    position: absolute; right: 72px; top: 64px; padding: 10px 20px; border-radius: 999px;
    border: 2px solid rgba(124,255,178,.5); background: rgba(124,255,178,.12); color: #7cffb2; font-size: 24px;
  }
  .features { display: flex; gap: 16px; margin-top: 48px; }
  .features span {
    flex: 1; text-align: center; padding: 18px 10px; border-radius: 10px; font-size: 22px;
    background: rgba(167,139,250,.12); border: 1px solid rgba(167,139,250,.45); color: #efeaff;
  }
  .ghost { position: absolute; right: 90px; top: 150px; font-size: 120px; opacity: .9; }
</style>
</head>
<body>
  <div class="badge">🔒 100% in-browser · zero uploads</div>
  <div class="ghost">👻</div>
  <div class="kicker">Kiroween 2026 · Resurrection</div>
  <h1>Ledger Revival<span>台账复活台</span></h1>
  <div class="raw">2026年10月23日华信会计师事务所年度审计费25000元已完成吴昊</div>
  <div class="arrow">⚰️ ↓ revive</div>
  <table>
    <tr><th>日期</th><th>单位/对象</th><th>事项</th><th>金额</th><th>状态</th><th>责任人</th></tr>
    <tr><td>2026-10-23</td><td>华信会计师事务所</td><td>年度审计费</td><td>25,000.00</td><td><span class="chip">已完成</span></td><td>吴昊</td></tr>
  </table>
  <div class="features">
    <span>Paste text / CSV</span><span>Auto-detect 6 fields</span><span>Search · Filter · Export</span><span>Zero dependencies</span>
  </div>
</body>
</html>
